epic_id: E-restore-flow
title: Restore original sielappkowo/mentora flow + consolidate /002
summary:
  total_tasks: 10
  by_status:
    pending: 10
    in_progress: 0
    blocked: 0
    done: 0
  by_effort:
    S: 4
    M: 4
    L: 2

business_scenarios: |
  Scenario: User implements an epic with one command
    Given a populated epic-{id}-tasks.yaml with pending tasks
    When the user runs /002-implement <epic-id>
    Then each pending task is iterated automatically
    And each task is dispatched to its own implementer subagent
    And each task presents a plan checkpoint before TDD execution
    And after all tasks reach status: done, /003-verify-dod auto-runs
    And after /003 returns ok, /004-code-review auto-runs

  Scenario: Verifier self-heals on findings
    Given /003-verify-dod returns status: fail with findings
    When the auto-fix loop is enabled
    Then a feedback-implementer subagent is dispatched to fix the findings
    And a re-verify subagent confirms the fix
    And the loop repeats max 3 iterations until status: ok or final fail

  Scenario: Reviewer self-heals on findings
    Given /004-code-review returns status: fail with findings
    When the auto-fix loop is enabled
    Then the same Phase 2/Phase 3 loop applies (max 3 iterations)

  Scenario: User initiates epic-level feedback round
    Given an epic with status done that needs user-feedback rework
    When the user runs /005-implement-feedback <epic-id> [feedback]
    Then feedback is gathered, clarified, new tasks appended to epic-{id}-tasks.yaml
    And new tasks go through ATDD impl -> /003 semantics -> /004 semantics -> gatekeeper audit

tasks:
