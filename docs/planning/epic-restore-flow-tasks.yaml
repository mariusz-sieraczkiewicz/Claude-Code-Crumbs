      - Phase 3 (re-verify) dispatches verifier; writes 03c-verify.json
      - Loop Phase 2 -> Phase 3 max 3 iterations; subsequent iterations numbered 03d/03e/03f/03g
      - Toggle auto_fix_on_verify_fail (default true for solo/small-team/oss; false for enterprise)
      - When toggle false -> current read-only behavior + suggest /005
      - Final status reflects last verify (ok | fail); fail after 3 iterations escalates to user
      - Append-only history: never overwrite prior NN-*.json
    description: |
      Restore sielappkowo /003-verify-dod Loop discipline (Phase 1 -> Phase 2 -> Phase 3,
      max 3 iter). Keep crumbs JSON artifact contract, schema validation, runs/ layout.

