    title: Delete /002-auto-implement and clean references
    status: pending
    effort: S
    depends_on: []
    files:
      - dev-workflow/commands/002-auto-implement.md (delete)
      - PRD.md
      - CONTEXT.md
      - .claude-plugin/marketplace.json (verify no entry; commands auto-discovered)
    acceptance_criteria:
      - File commands/002-auto-implement.md does not exist
      - No grep hit for "002-auto-implement" in dev-workflow/, PRD.md, CONTEXT.md (except in this epic file)
      - Marketplace JSON unchanged (commands are auto-discovered, not enumerated)
    description: |
      Remove the standalone batch conductor. Its behavior moves into /002-implement
      default mode (epic-arg). Strip all narrative referencing /002-auto-implement
      from other command bodies, PRD command table, CONTEXT subagent-chain text.

  - id: T-002
    title: Rewrite /002-implement as epic-default with per-task plan checkpoint
    status: pending
    effort: L
    depends_on: [T-001]
    files:
      - dev-workflow/commands/002-implement.md
    acceptance_criteria:
      - Accepts <epic-id> (default mode) OR <task-id> (single-task mode); dispatch on shape
      - Epic mode iterates all status: pending tasks from epic-{id}-tasks.yaml in dependency order
      - Per task: Phase 1.5 = plan-only implementer dispatch + AskUserQuestion(Approve/Iterate/Cancel)
      - Iterate -> re-dispatch implementer plan-only with user feedback; numbered 02a-plan, 02b-plan, ...
      - Approve -> Phase 2 full TDD execution with prior plan as context
      - All tasks done -> auto-invoke /003-verify-dod (no user prompt)
      - /003 ok -> auto-invoke /004-code-review (gated by auto_invoke_review toggle)
      - Single-task mode preserves current Phase 0..6 semantics (resume detection, branch, etc.)
      - Locking: epic mode holds .lock-<epic_id>; task mode holds .lock-<epic_id>-<task_id>
    description: |
      Mirror sielappkowo /002-plan-and-implement Phase 1 (plan present + iterate till
      accepted) per task, before the TDD loop. Then mirror automation: after all
      tasks done, /003 and /004 auto-fire. Keep existing zero-tolerance gates,
      append-only artifacts, lock semantics.

  - id: T-003
    title: Add self-healing Phase 2/3 + Loop to /003-verify-dod
    status: pending
    effort: M
    depends_on: [T-001]
    files:
      - dev-workflow/commands/003-verify-dod.md
    acceptance_criteria:
