<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 20px;
      background: #16213e;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    #header-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #header h1 {
      font-size: 1.1em;
      font-weight: 600;
      color: #a0a0c0;
      flex-shrink: 0;
    }
    #project-dir {
      font-size: 0.78em;
      color: #6b7280;
      font-family: 'SF Mono', 'Menlo', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    select {
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #3a3a5a;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85em;
      min-width: 400px;
      flex: 1;
      max-width: 600px;
    }
    #status {
      font-size: 0.8em;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    #status-dot.connected { background: #10b981; }

    #timeline {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .entry {
      padding: 12px 14px;
      margin: 8px 0;
      border-radius: 6px;
      animation: fadeIn 0.3s ease;
    }
    .entry.progress {
      padding: 8px 14px;
      margin: 4px 0;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .entry .time {
      color: #6b7280;
      font-size: 0.75em;
      font-family: 'SF Mono', 'Menlo', monospace;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .entry .role {
      font-size: 0.92em;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: lowercase;
      padding: 1px 7px;
      border-radius: 4px;
    }
    .entry .role.user { color: #93c5fd; background: rgba(96,165,250,0.15); }
    .entry .role.assistant { color: #a7f3d0; background: rgba(16,185,129,0.15); }
    .entry .role.summary { color: #fca5a5; background: rgba(239,68,68,0.15); }
    .step .step-detail {
      display: block;
      font-size: 0.88em;
      font-weight: 400;
      opacity: 0.62;
      font-style: italic;
      padding-left: 2px;
    }
    .entry .progress-text {
      color: #9ca3af;
      font-size: 0.82em;
      font-style: italic;
      border-left: 2px solid #4b5563;
      padding-left: 10px;
    }
    .entry .user-line {
      background: #1e2a4a;
      border-left: 3px solid #60a5fa;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.9em;
      color: #93c5fd;
      margin-bottom: 6px;
    }
    .entry .agent-steps {
      background: #162e1e;
      border-left: 3px solid #10b981;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.85em;
      color: #a7f3d0;
    }
    .entry .agent-steps .step {
      padding: 2px 0;
    }
    .entry .agent-steps .step::before {
      content: '— ';
      color: #6b7280;
    }
    .entry .summary-steps {
      background: #2a1520;
      border-left: 3px solid #ef4444;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.85em;
      color: #fca5a5;
    }
    .entry .summary-steps .step {
      padding: 2px 0;
    }
    .entry .summary-steps .step::before {
      content: '▸ ';
      color: #991b1b;
    }
    #show-all {
      background: none;
      border: 1px solid #3a3a5a;
      color: #9ca3af;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8em;
    }
    #show-all:hover { color: #e0e0e0; border-color: #60a5fa; }
    #empty {
      text-align: center;
      color: #6b7280;
      padding: 60px 20px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div id="header">
    <div id="header-row">
      <h1>Session Monitor</h1>
      <select id="session-select">
        <option value="">Select session...</option>
      </select>
      <button id="show-all">Show all</button>
      <div id="status">
        <div id="status-dot"></div>
        <span id="status-text">Disconnected</span>
      </div>
    </div>
    <span id="project-dir" title=""></span>
  </div>
  <div id="timeline">
    <div id="empty">Select a session to start monitoring.</div>
  </div>

  <script>
    const timeline = document.getElementById('timeline');
    const projectDirEl = document.getElementById('project-dir');
    const sessionSelect = document.getElementById('session-select');
    const showAllBtn = document.getElementById('show-all');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    let autoScroll = true;
    let currentSessionId = null;
    let lastEntryId = 0;
    let pollTimer = null;
    let sessionLimit = 10;

    timeline.addEventListener('scroll', () => {
      const { scrollTop, scrollHeight, clientHeight } = timeline;
      autoScroll = scrollTop + clientHeight >= scrollHeight - 40;
    });

    showAllBtn.addEventListener('click', () => {
      sessionLimit = 100;
      showAllBtn.style.display = 'none';
      loadSessions();
    });

    async function loadSessions() {
      try {
        const res = await fetch(`/api/sessions?limit=${sessionLimit}`);
        const sessions = await res.json();
        const prevValue = sessionSelect.value;
        sessionSelect.innerHTML = '<option value="">Select session...</option>';
        for (const s of sessions) {
          const opt = document.createElement('option');
          opt.value = s.id;
          const date = new Date(s.mtime);
          const label = s.title || s.id.slice(0, 12) + '...';
          const time = date.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
          opt.textContent = `${time} — ${label}`;
          sessionSelect.appendChild(opt);
        }
        if (prevValue && sessions.some(s => s.id === prevValue)) {
          sessionSelect.value = prevValue;
        } else if (sessions.length > 0 && !currentSessionId) {
          sessionSelect.value = sessions[0].id;
          selectSession(sessions[0].id);
        }
      } catch {}
    }

    async function selectSession(sessionId) {
      if (sessionId === currentSessionId) return;
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      currentSessionId = sessionId;
      lastEntryId = 0;
      allEntries = [];
      timeline.innerHTML = '';
      if (!sessionId) {
        timeline.innerHTML = '<div id="empty">Select a session to start monitoring.</div>';
        setStatus(false);
        return;
      }
      await fetch('/api/watch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: sessionId }),
      });
      setStatus(true);
      pollEntries();
      pollTimer = setInterval(pollEntries, 2000);
    }

    let allEntries = [];

    async function pollEntries() {
      try {
        const res = await fetch(`/api/entries?session=${currentSessionId}&after=0`);
        const entries = await res.json();
        if (entries.length !== allEntries.length) {
          allEntries = entries;
          rebuildTimeline();
        }
        setStatus(true);
      } catch {
        setStatus(false);
      }
    }

    function rebuildTimeline() {
      lastEntryType = null;
      lastAgentBlock = null;
      lastTimeEl = null;
      timeline.innerHTML = '';
      for (const entry of allEntries) {
        addEntry(entry);
      }
    }

    function setStatus(ok) {
      statusDot.className = ok ? 'connected' : '';
      statusText.textContent = ok ? 'Watching' : 'Disconnected';
    }

    let lastEntryType = null;
    let lastAgentBlock = null;
    let lastTimeEl = null;

    const fmtTime = (ts) => new Date(ts).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    function appendStep(block, headline, detail) {
      const stepDiv = document.createElement('div');
      stepDiv.className = 'step';
      stepDiv.textContent = headline;
      if (detail) {
        const d = document.createElement('span');
        d.className = 'step-detail';
        d.textContent = detail;
        stepDiv.appendChild(d);
      }
      block.appendChild(stepDiv);
    }

    function addEntry(entry) {
      const isSummary = entry.type === 'summary';
      const isAgent = !isSummary && (entry.type === 'progress' || (entry.agent && entry.agent.length > 0 && !entry.user));
      const isUser = !!entry.user && !isAgent && !isSummary;
      const steps = entry.agent || (entry.summary ? [entry.summary] : []);
      const details = entry.details || [];

      // Merge agent entries, but start new block every 5 steps
      if (isAgent && lastEntryType === 'agent' && lastAgentBlock && lastTimeEl) {
        const currentSteps = lastAgentBlock.querySelectorAll('.step').length;
        if (currentSteps < 5) {
          lastTimeEl.textContent = fmtTime(entry.ts);
          steps.forEach((step, i) => appendStep(lastAgentBlock, step, details[i]));
          if (autoScroll) timeline.scrollTop = timeline.scrollHeight;
          return;
        }
        // Over 5 steps — fall through to create new block
      }

      const div = document.createElement('div');
      div.className = 'entry';

      const time = document.createElement('div');
      time.className = 'time';
      const role = isUser ? 'user' : isSummary ? 'summary' : 'assistant';
      const roleChip = document.createElement('span');
      roleChip.className = 'role ' + role;
      roleChip.textContent = role;
      time.appendChild(roleChip);
      const timeText = document.createElement('span');
      timeText.textContent = fmtTime(entry.ts);
      time.appendChild(timeText);
      div.appendChild(time);

      if (isUser) {
        const userLine = document.createElement('div');
        userLine.className = 'user-line';
        userLine.textContent = entry.user;
        div.appendChild(userLine);
        lastEntryType = 'user';
        lastAgentBlock = null;
        lastTimeEl = null;
      }

      if (steps.length > 0) {
        const stepsBlock = document.createElement('div');
        stepsBlock.className = isSummary ? 'summary-steps' : 'agent-steps';
        steps.forEach((step, i) => appendStep(stepsBlock, step, details[i]));
        div.appendChild(stepsBlock);
        if (isAgent) {
          lastEntryType = 'agent';
          lastAgentBlock = stepsBlock;
          lastTimeEl = timeText;
        }
        if (isSummary) {
          lastEntryType = 'summary';
          lastAgentBlock = null;
          lastTimeEl = null;
        }
      }

      timeline.appendChild(div);
      if (autoScroll) timeline.scrollTop = timeline.scrollHeight;
    }

    sessionSelect.addEventListener('change', () => {
      selectSession(sessionSelect.value);
    });

    async function loadProjectDir() {
      try {
        const res = await fetch('/api/info');
        const info = await res.json();
        if (info.project) {
          projectDirEl.textContent = info.project;
          projectDirEl.title = info.project;
        }
      } catch {}
    }

    loadProjectDir();
    loadSessions();
    setInterval(loadSessions, 10000);
  </script>
</body>
</html>
