name: Auto version bump

# Bumps patch version for each plugin independently when its files change.
# Skipped when the commit was itself a bump (marker [skip-bump]) or a
# manual bump (commit message starts with "Bump version") — that lets a
# human author a minor / major bump in-place without the workflow
# re-bumping on top.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-bump]') && !startsWith(github.event.head_commit.message, 'Bump version') }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed plugins and bump versions
        id: bump
        run: |
          set -euo pipefail
          marketplace=.claude-plugin/marketplace.json

          # Get files changed in the triggering commit
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          bumped_plugins=""

          python3 <<'EOF'
          import json, subprocess, sys

          marketplace_path = ".claude-plugin/marketplace.json"
          with open(marketplace_path) as f:
              marketplace = json.load(f)

          # Get changed files
          result = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD"],
                                  capture_output=True, text=True)
          changed_files = result.stdout.strip().split("\n") if result.stdout.strip() else []

          plugins = marketplace["plugins"]
          bumped = []

          for i, plugin in enumerate(plugins):
              source_dir = plugin["source"].lstrip("./")
              plugin_json_path = f"{source_dir}/.claude-plugin/plugin.json"

              # Check if any changed file is inside this plugin's directory
              plugin_changed = any(f.startswith(f"{source_dir}/") for f in changed_files)
              if not plugin_changed:
                  continue

              # Bump patch version
              current = plugin["version"]
              parts = current.split(".")
              parts[2] = str(int(parts[2]) + 1)
              new_version = ".".join(parts)

              # Update marketplace.json
              plugins[i]["version"] = new_version

              # Update plugin's own plugin.json
              with open(plugin_json_path) as f:
                  pj = json.load(f)
              pj["version"] = new_version
              with open(plugin_json_path, "w") as f:
                  json.dump(pj, f, indent=2)
                  f.write("\n")

              bumped.append(f"{plugin['name']} {current} -> {new_version}")

          if bumped:
              with open(marketplace_path, "w") as f:
                  json.dump(marketplace, f, indent=2)
                  f.write("\n")

              # Write summary for commit message
              with open("/tmp/bump-summary.txt", "w") as f:
                  f.write("; ".join(bumped))
          else:
              with open("/tmp/bump-summary.txt", "w") as f:
                  f.write("")
          EOF

          summary=$(cat /tmp/bump-summary.txt)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          set -euo pipefail
          summary="${{ steps.bump.outputs.summary }}"
          if [ -z "$summary" ]; then
            echo "No plugin files changed — nothing to bump."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json dev-workflow/.claude-plugin/plugin.json crumbs/.claude-plugin/plugin.json
          if git diff --cached --quiet; then
            echo "No version change to commit."
            exit 0
          fi
          git commit -m "Bump version: ${summary} [skip-bump]"
          git push origin main
