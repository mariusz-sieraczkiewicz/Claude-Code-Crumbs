name: Auto version bump

# Bumps the patch component of the plugin version on every push to main.
# Skipped when the commit was itself a bump (marker [skip-bump]) or a
# manual bump (commit message starts with "Bump version") — that lets a
# human author a minor / major bump in-place without the workflow
# re-bumping on top.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip-bump]') &&
      !startsWith(github.event.head_commit.message, 'Bump version')
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          marketplace=.claude-plugin/marketplace.json
          plugin=claude-code-crumbs/.claude-plugin/plugin.json

          current=$(python3 -c "import json; print(json.load(open('$marketplace'))['plugins'][0]['version'])")
          IFS='.' read -r maj min pat <<< "$current"
          new="${maj}.${min}.$((pat + 1))"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

          python3 <<EOF
          import json, sys

          new = "$new"

          # marketplace.json — plugins[0].version
          path = "$marketplace"
          with open(path) as f:
              d = json.load(f)
          d["plugins"][0]["version"] = new
          with open(path, "w") as f:
              json.dump(d, f, indent=2)
              f.write("\n")

          # plugin.json — top-level version
          path = "$plugin"
          with open(path) as f:
              d = json.load(f)
          d["version"] = new
          with open(path, "w") as f:
              json.dump(d, f, indent=2)
              f.write("\n")
          EOF

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json claude-code-crumbs/.claude-plugin/plugin.json
          if git diff --cached --quiet; then
            echo "No version change to commit (versions already match new value)."
            exit 0
          fi
          git commit -m "Bump version ${{ steps.bump.outputs.current }} -> ${{ steps.bump.outputs.new }} [skip-bump]"
          git push origin main
